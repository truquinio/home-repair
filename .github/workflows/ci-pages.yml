name: CI and GitHub Pages

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  java:
    name: Java tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Maven tests
        run: ./mvnw --batch-mode test

  demo:
    name: Validate static demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build static artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/img
          cp demo/index.html demo/styles.css demo/app.js public/
          cp -R src/main/resources/static/img/. public/img/
          test -s public/index.html
          test -s public/styles.css
          test -s public/app.js
          ! grep -R "/src/main/resources" public/index.html public/app.js public/styles.css
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [java, demo]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
