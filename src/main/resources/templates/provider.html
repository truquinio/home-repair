<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="th_templates/head :: head"></head>
<body>
  <header th:replace="th_templates/navbar :: navbar"></header>

  <main class="main-providers">
    <div class="container text-center">
      <img class="image4" src="/img/provider.svg" alt="">
      <h1 class="big-title2">Profesionales para tu hogar</h1>
      <p class="subtittle">Filtrá por especialidad o buscá por nombre y email.</p>
    </div>

    <form class="container" method="get" th:action="@{/search}">
      <div class="row g-3 align-items-end justify-content-center">
        <div class="col-12 col-md-4">
          <label class="label" for="profession">Especialidad</label>
          <select id="profession" name="profession" class="inputs">
            <option value="">Todas las profesiones</option>
            <option th:each="profession : ${professions}"
                    th:text="${#strings.capitalize(#strings.toLowerCase(profession.name()))}"
                    th:value="${profession}">
            </option>
          </select>
        </div>

        <div class="col-12 col-md-5">
          <label class="label" for="st">Buscar profesional</label>
          <input type="search"
                 name="st"
                 id="st"
                 placeholder="Nombre, apellido o email">
        </div>

        <div class="col-12 col-md-auto">
          <button class="btn btn-warning button" type="submit">Buscar</button>
        </div>
      </div>
    </form>

    <section class="container" aria-label="Resultados">
      <div th:replace="th_templates/cardsProvider :: cardProvider"></div>
      <p class="text-center"
         th:if="${searchReturn != null and #lists.isEmpty(searchReturn)}">
        No encontramos profesionales con esos filtros.
      </p>
    </section>
  </main>

  <footer th:replace="th_templates/footer :: footer"></footer>
  <div th:replace="th_templates/bootstrap :: bootstrap"></div>
</body>
</html>
