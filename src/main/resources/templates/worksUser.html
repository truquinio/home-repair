<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="th_templates/head :: head"></head>
<body>
  <header th:replace="th_templates/navbar :: navbar"></header>

  <main class="main-index">
    <div class="container text-center">
      <div class="row">
        <div class="col left-col">
          <h1 sec:authorize="hasRole('ROLE_PROVIDER')" class="big-title">Tus trabajos</h1>
          <h1 sec:authorize="hasRole('ROLE_CUSTOMER')" class="big-title">Mis solicitudes</h1>
        </div>
        <div class="col">
          <img class="image3" src="/img/request.svg" alt="Ilustración de solicitudes de trabajo">
        </div>
      </div>
    </div>

    <section aria-label="Trabajos del proveedor" sec:authorize="hasRole('ROLE_PROVIDER')">
      <article class="card text-center large-card" th:each="work : ${providerWorkList}">
        <div class="card-body">
          <h3 class="card-title">
            <img th:src="@{'/image/DB/' + ${work.customer.image}}" alt="" class="imagen-customer">
            <span th:text="${work.customer.name + ' ' + work.customer.lastname}"></span>
          </h3>
          <p class="card-text" th:text="${work.workName}"></p>
          <p th:text="${'Problema: ' + work.workDescription}"></p>

          <div th:if="${work.workStatus.name() == 'REQUIRED'}">
            <form th:action="@{/work/status}" method="post" class="d-inline">
              <input type="hidden" name="idWork" th:value="${work.id}">
              <input type="hidden" name="wStat" value="ACCEPTED">
              <button type="submit" class="btn btn-warning">Aceptar trabajo ✅</button>
            </form>
            <form th:action="@{/work/status}" method="post" class="d-inline">
              <input type="hidden" name="idWork" th:value="${work.id}">
              <input type="hidden" name="wStat" value="REVERT">
              <button type="submit" class="btn btn-warning">Rechazar solicitud ❌</button>
            </form>
          </div>

          <div th:if="${work.workStatus.name() == 'ACCEPTED'}">
            <form th:action="@{/work/status}" method="post" class="d-inline">
              <input type="hidden" name="idWork" th:value="${work.id}">
              <input type="hidden" name="wStat" value="DONE">
              <button type="submit" class="btn btn-warning">Finalizar trabajo ✅</button>
            </form>
            <form th:action="@{/work/status}" method="post" class="d-inline">
              <input type="hidden" name="idWork" th:value="${work.id}">
              <input type="hidden" name="wStat" value="REVERT">
              <button type="submit" class="btn btn-warning">Cancelar trabajo ❌</button>
            </form>
          </div>

          <p th:if="${work.workStatus.name() == 'DONE'}">✅ Trabajo terminado. Aún no fue valorado.</p>
          <p th:if="${work.workStatus.name() == 'REVIEWD'}">✅ Trabajo terminado y valorado.</p>
          <p th:if="${work.workStatus.name() == 'REVERT'}">🚫 Trabajo cancelado.</p>
        </div>
      </article>
    </section>

    <section aria-label="Solicitudes del cliente" sec:authorize="hasRole('ROLE_CUSTOMER')">
      <article class="card text-center large-card" th:each="work : ${customerWorkList}">
        <div class="card-body">
          <h3 class="card-title">
            <img th:src="@{'/image/DB/' + ${work.provider.image}}" alt="" class="imagen-customer">
            <span th:text="${work.provider.name + ' ' + work.provider.lastname}"></span>
          </h3>
          <p class="card-text" th:text="${work.workName}"></p>
          <p th:text="${work.workDescription}"></p>

          <form th:if="${work.workStatus.name() == 'REQUIRED'}" th:action="@{/work/status}" method="post">
            <input type="hidden" name="idWork" th:value="${work.id}">
            <input type="hidden" name="wStat" value="REVERT">
            <button type="submit" class="btn btn-warning">Cancelar solicitud ❌</button>
          </form>

          <div th:if="${work.workStatus.name() == 'ACCEPTED'}">
            <p>⏳ Trabajo en curso</p>
            <form th:action="@{/work/status}" method="post" class="d-inline">
              <input type="hidden" name="idWork" th:value="${work.id}">
              <input type="hidden" name="wStat" value="DONE">
              <button type="submit" class="btn btn-warning">Finalizar trabajo ✅</button>
            </form>
            <form th:action="@{/work/status}" method="post" class="d-inline">
              <input type="hidden" name="idWork" th:value="${work.id}">
              <input type="hidden" name="wStat" value="REVERT">
              <button type="submit" class="btn btn-warning">Cancelar trabajo ❌</button>
            </form>
          </div>

          <a th:if="${work.workStatus.name() == 'DONE'}"
             th:href="@{/work/create(applicationType='review', idWork=${work.id})}"
             class="btn btn-warning">Dejar valoración ⭐</a>

          <div th:if="${work.workStatus.name() == 'REVIEWD'}">
            <p>✅ Trabajo terminado y valorado.</p>
            <p th:text="${work.review}"></p>
          </div>

          <p th:if="${work.workStatus.name() == 'REVERT'}">🚫 Trabajo cancelado.</p>
        </div>
      </article>
    </section>
  </main>

  <footer th:replace="th_templates/footer :: footer"></footer>
  <div th:replace="th_templates/bootstrap :: bootstrap"></div>
</body>
</html>
