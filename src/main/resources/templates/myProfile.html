<!DOCTYPE html>
<html lang="es-ES" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="th_templates/head :: head"></head>
<body>
  <header th:replace="th_templates/navbar :: navbar"></header>

  <main id="main-content" class="main-index">
    <div class="container text-center" th:object="${user}">
      <img class="image-profile" th:src="@{'/image/DB/' + *{image}}" alt="Foto de perfil">
      <h1 class="big-title">Mi perfil</h1>
    </div>

    <form class="profile-form" id="profile-form" th:object="${user}" method="post"
          th:action="@{'/user/perfil/' + ${user.id} + '/mod'}" enctype="multipart/form-data">
      <input type="hidden" id="current-role" th:value="*{role}">

      <label class="label" for="profile-name">Nombre</label>
      <input type="text" id="profile-name" name="name" th:value="*{name}" maxlength="60" required>

      <label class="label" for="profile-lastname">Apellido</label>
      <input type="text" id="profile-lastname" name="lastname" th:value="*{lastname}" maxlength="60" required>

      <div class="provider-only">
        <label class="label" for="profile-phone">Teléfono</label>
        <input type="tel" id="profile-phone" name="phone" th:value="*{phone}" maxlength="30">

        <label class="label" for="profile-profession">Profesión</label>
        <select id="profile-profession" class="inputs profession" th:field="*{profession}">
          <option th:each="profession : ${professions}" th:text="${profession.name}" th:value="${profession}"></option>
        </select>

        <label class="label" for="profile-description">Descripción</label>
        <textarea id="profile-description" name="description" th:text="*{description}" maxlength="500"></textarea>
      </div>

      <label class="btn btn-warning button btn-upload-photo1" for="profile-image">📸 Subir foto de perfil</label>
      <input type="file" id="profile-image" name="img" accept=".png,.jpeg,.jpg,.webp,image/png,image/jpeg,image/webp" hidden>

      <div class="row justify-content-center text-center">
        <div class="col-12 col-md-4">
          <button class="btn btn-warning button" type="submit">🔄 Actualizar</button>
        </div>
        <div class="col-12 col-md-4" sec:authorize="!hasRole('ROLE_ADMIN')">
          <button id="show-role-form" class="btn btn-warning button" type="button">👤 Cambiar rol</button>
        </div>
        <div class="col-12 col-md-4" sec:authorize="!hasRole('ROLE_ADMIN')">
          <button id="show-delete-form" class="btn btn-warning button" type="button">Desactivar cuenta</button>
        </div>
      </div>
    </form>

    <form class="profile-form" id="role-form" th:object="${user}" method="post"
          th:action="@{'/user/perfil/' + ${user.id} + '/change'}"
          enctype="multipart/form-data" hidden>
      <h2 class="big-title2">Cambiar tipo de perfil</h2>
      <p class="text-center">
        Al confirmar, cambiarás entre perfil de cliente y proveedor y tendrás que volver a iniciar sesión.
      </p>

      <label class="label" for="role-name">Nombre</label>
      <input type="text" id="role-name" name="name" th:value="*{name}" maxlength="60" required>

      <label class="label" for="role-lastname">Apellido</label>
      <input type="text" id="role-lastname" name="lastname" th:value="*{lastname}" maxlength="60" required>

      <div id="role-provider-fields">
        <label class="label" for="role-phone">Teléfono</label>
        <input type="tel" id="role-phone" name="phone" th:value="*{phone}" maxlength="30">

        <label class="label" for="role-profession">Profesión</label>
        <select id="role-profession" class="inputs profession" name="profession">
          <option value="">Elige una profesión</option>
          <option th:each="profession : ${professions}" th:text="${profession.name}" th:value="${profession}"></option>
        </select>

        <label class="label" for="role-description">Descripción</label>
        <textarea id="role-description" name="description" th:text="*{description}" maxlength="500"></textarea>
      </div>

      <label class="btn btn-warning button" for="role-image">📸 Elegir nueva foto</label>
      <input type="file" id="role-image" name="img" accept=".png,.jpeg,.jpg,.webp,image/png,image/jpeg,image/webp" hidden>

      <button class="btn btn-warning button" type="submit">Confirmar cambio</button>
      <button id="cancel-role-form" class="btn btn-warning button" type="button">Cancelar</button>
    </form>

    <form id="delete-form"
          sec:authorize="!hasRole('ROLE_ADMIN')"
          method="post"
          th:action="@{'/user/perfil/' + ${user.id} + '/del'}"
          hidden>
      <h2 class="big-title2">¿Quieres desactivar esta cuenta?</h2>
      <p class="subtitle text-center">La cuenta quedará inactiva y no podrá iniciar sesión.</p>
      <div class="text-center">
        <button type="submit" class="btn btn-warning button">🗑 Sí, desactivar</button>
        <button id="cancel-delete-form" type="button" class="btn btn-warning button">Cancelar</button>
      </div>
    </form>
  </main>

  <footer th:replace="th_templates/footer :: footer"></footer>
  <div th:replace="th_templates/bootstrap :: bootstrap"></div>

  <script>
    const role = document.getElementById("current-role").value;
    const providerFields = document.querySelectorAll(".provider-only");
    const profileForm = document.getElementById("profile-form");
    const roleForm = document.getElementById("role-form");
    const deleteForm = document.getElementById("delete-form");
    const roleProviderFields = document.getElementById("role-provider-fields");

    providerFields.forEach(element => {
      element.hidden = role !== "PROVIDER";
    });

    if (roleProviderFields) {
      roleProviderFields.hidden = role === "PROVIDER";
    }

    document.getElementById("show-role-form")?.addEventListener("click", () => {
      profileForm.hidden = true;
      deleteForm.hidden = true;
      roleForm.hidden = false;
    });

    document.getElementById("cancel-role-form")?.addEventListener("click", () => {
      roleForm.hidden = true;
      profileForm.hidden = false;
    });

    document.getElementById("show-delete-form")?.addEventListener("click", () => {
      profileForm.hidden = true;
      roleForm.hidden = true;
      deleteForm.hidden = false;
    });

    document.getElementById("cancel-delete-form")?.addEventListener("click", () => {
      deleteForm.hidden = true;
      profileForm.hidden = false;
    });

    document.querySelectorAll(".profession").forEach(select => {
      Array.from(select.options).forEach((option, index) => {
        if (index === 0 && !option.value) return;
        const text = option.text.toLowerCase();
        option.text = text.charAt(0).toUpperCase() + text.slice(1);
      });
    });
  </script>
</body>
</html>
