<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="th_templates/head :: head"></head>
<body>
  <header th:replace="th_templates/navbar :: navbar"></header>

  <main class="main-index">
    <div class="alert alert-danger" role="alert" th:if="${not #strings.isEmpty(mssg)}">
      <p th:text="${mssg}" class="text-center"></p>
    </div>

    <div class="container text-center">
      <img class="image2" src="/img/register.svg" alt="Ilustración de registro">
      <h1 class="big-title2">Registrate 📝</h1>
      <p class="subtitle2">Elegí cómo querés usar Home Repair.</p>
    </div>

    <div class="row row-user-card" role="group" aria-label="Tipo de cuenta">
      <div class="col card-user">
        <button id="customer-card" class="card" type="button">
          <img src="/img/customer-avatar.png" class="card-img-top" alt="">
          <span class="card-title">Cliente</span>
          <span class="card-text">Quiero contratar un servicio</span>
        </button>
      </div>
      <div class="col card-user">
        <button id="provider-card" class="card" type="button">
          <img src="/img/provider-avatar.png" class="card-img-top" alt="">
          <span class="card-title">Proveedor</span>
          <span class="card-text">Quiero ofrecer mis servicios</span>
        </button>
      </div>
    </div>

    <div id="form-container" class="form-display" hidden>
      <form id="register-form" method="post" th:object="${user}" th:action="@{/user/register}">
        <div class="field">
          <label class="label" for="name">Nombre</label>
          <input type="text" id="name" th:field="*{name}" maxlength="60" required>
        </div>

        <div class="field">
          <label class="label" for="lastname">Apellido</label>
          <input type="text" id="lastname" th:field="*{lastname}" maxlength="60" required>
        </div>

        <div class="field">
          <label class="label" for="email">Email</label>
          <input type="email" id="email" th:field="*{email}" autocomplete="email" maxlength="120" required>
        </div>

        <div id="phone-group" class="field">
          <label class="label" for="phone">Teléfono</label>
          <input type="tel" id="phone" th:field="*{phone}" maxlength="30">
        </div>

        <div class="field">
          <label class="label" for="password">Contraseña</label>
          <input type="password" id="password" th:field="*{password}" autocomplete="new-password" minlength="6" required>
        </div>

        <div class="field">
          <label class="label" for="password2">Repetí tu contraseña</label>
          <input type="password" id="password2" autocomplete="new-password" minlength="6" required>
        </div>

        <div id="profession-group" class="field">
          <label class="label" for="profession">Profesión</label>
          <select id="profession" th:field="*{profession}">
            <option value="">Elegí tu profesión</option>
            <option th:each="profession : ${professions}" th:text="${profession.name}" th:value="${profession}"></option>
          </select>
        </div>

        <div id="description-group" class="field">
          <label class="label" for="description">Descripción</label>
          <textarea id="description" maxlength="500" th:field="*{description}" placeholder="Contá brevemente qué servicios ofrecés"></textarea>
        </div>

        <button type="submit" class="btn btn-warning button btn-form">Crear cuenta 📝</button>
      </form>
    </div>
  </main>

  <footer th:replace="th_templates/footer :: footer"></footer>
  <div th:replace="th_templates/bootstrap :: bootstrap"></div>

  <script>
    const providerCard = document.getElementById("provider-card");
    const customerCard = document.getElementById("customer-card");
    const formContainer = document.getElementById("form-container");
    const profession = document.getElementById("profession");
    const phone = document.getElementById("phone");
    const description = document.getElementById("description");
    const password = document.getElementById("password");
    const password2 = document.getElementById("password2");

    function selectType(provider) {
      formContainer.hidden = false;
      document.getElementById("phone-group").hidden = !provider;
      document.getElementById("profession-group").hidden = !provider;
      document.getElementById("description-group").hidden = !provider;

      phone.required = provider;
      profession.required = provider;
      description.required = provider;

      if (!provider) {
        phone.value = "";
        profession.value = "";
        description.value = "";
      }

      providerCard.classList.toggle("highlight", provider);
      customerCard.classList.toggle("highlight", !provider);
    }

    providerCard.addEventListener("click", () => selectType(true));
    customerCard.addEventListener("click", () => selectType(false));

    function validatePassword() {
      password2.setCustomValidity(
        password.value === password2.value ? "" : "Las contraseñas no coinciden"
      );
    }

    password.addEventListener("input", validatePassword);
    password2.addEventListener("input", validatePassword);

    Array.from(profession.options).forEach((option, index) => {
      if (index === 0) return;
      const text = option.text.toLowerCase();
      option.text = text.charAt(0).toUpperCase() + text.slice(1);
    });
  </script>
</body>
</html>
