<!DOCTYPE html>
<html lang="es-ES" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="th_templates/head :: head"></head>
<body>
  <header th:replace="th_templates/navbar :: navbar"></header>

  <main id="main-content" class="main-index">
    <div class="alert alert-danger" role="alert" th:if="${not #strings.isEmpty(mssg)}">
      <p th:text="${mssg}" class="text-center"></p>
    </div>

    <div class="container text-center">
      <div class="row">
        <div class="col">
          <img class="image2" src="/img/login.svg" alt="Ilustración de inicio de sesión">
        </div>
      </div>
      <div class="row">
        <div class="col">
          <h1 class="big-title2">Iniciar sesión</h1>
        </div>
      </div>
    </div>

    <form class="form-container" th:action="@{/logincheck}" method="post">
      <label class="label" for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" placeholder="Correo electrónico" autocomplete="email" required>

      <label class="label" for="password">Contraseña</label>
      <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>

      <button type="submit" class="btn btn-warning button btn-form">Iniciar sesión</button>
    </form>
  </main>

  <footer th:replace="th_templates/footer :: footer"></footer>
  <div th:replace="th_templates/bootstrap :: bootstrap"></div>
</body>
</html>
