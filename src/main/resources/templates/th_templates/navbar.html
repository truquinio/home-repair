<header th:fragment="navbar">
  <nav class="navbar navbar-expand-lg bg-body-tertiary" aria-label="Navegación principal">
    <div class="container-fluid">
      <a class="navbar-brand"
         th:href="${session.userSession == null} ? @{/} : @{/home}">
        <img src="/img/logo.svg" alt="" width="30" height="24" class="d-inline-block align-text-top logo">
        Home Repair
      </a>

      <button class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNavDropdown"
              aria-controls="navbarNavDropdown"
              aria-expanded="false"
              aria-label="Abrir navegación">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNavDropdown">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item">
            <a class="nav-link" th:href="@{/about}">Sobre Home Repair</a>
          </li>

          <li class="nav-item" sec:authorize="hasRole('ROLE_PROVIDER')">
            <a th:href="@{/work/worksList}" class="nav-link">Mis trabajos</a>
          </li>

          <li class="nav-item" sec:authorize="hasRole('ROLE_CUSTOMER')">
            <a th:href="@{/work/worksList}" class="nav-link">Mis solicitudes</a>
          </li>

          <li class="nav-item dropdown" sec:authorize="hasRole('ROLE_CUSTOMER')">
            <a class="nav-link dropdown-toggle"
               href="#"
               role="button"
               data-bs-toggle="dropdown"
               aria-expanded="false">
              Servicios
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" th:href="@{/search(profession='ALBAÑIL',st='')}">Albañilería</a></li>
              <li><a class="dropdown-item" th:href="@{/search(profession='CARPINTERO',st='')}">Carpintería</a></li>
              <li><a class="dropdown-item" th:href="@{/search(profession='CERRAJERO',st='')}">Cerrajería</a></li>
              <li><a class="dropdown-item" th:href="@{/search(profession='ELECTRICISTA',st='')}">Electricidad</a></li>
              <li><a class="dropdown-item" th:href="@{/search(profession='GASISTA',st='')}">Gas</a></li>
              <li><a class="dropdown-item" th:href="@{/search(profession='HERRERO',st='')}">Herrería</a></li>
              <li><a class="dropdown-item" th:href="@{/search(profession='LIMPIEZA',st='')}">Limpieza</a></li>
              <li><a class="dropdown-item" th:href="@{/search(profession='PLOMERO',st='')}">Plomería</a></li>
            </ul>
          </li>

          <li class="nav-item" th:if="${session.userSession == null}">
            <a class="nav-link" th:href="@{/user/register}">Registrarse</a>
          </li>

          <li class="nav-item" th:if="${session.userSession == null}">
            <a class="nav-link" th:href="@{/login}">Ingresar</a>
          </li>

          <li class="nav-item" sec:authorize="hasRole('ROLE_ADMIN')">
            <a th:href="@{/admin/dashboard}" class="nav-link">Administración</a>
          </li>

          <li class="nav-item dropdown" th:if="${session.userSession != null}">
            <a class="nav-link dropdown-toggle"
               href="#"
               role="button"
               data-bs-toggle="dropdown"
               aria-expanded="false">
              <img th:src="@{'/image/DB/' + ${session.userSession.image}}"
                   alt=""
                   class="image-profile-navbar">
              <span class="user-name" th:text="${session.userSession.name}"></span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item"
                   th:href="@{/user/perfil/{id}(id=${session.userSession.id})}">
                  Mi perfil
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <form th:action="@{/logout}" method="post">
                  <button class="dropdown-item" type="submit">Cerrar sesión</button>
                </form>
              </li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
