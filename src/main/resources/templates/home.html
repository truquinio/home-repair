<!DOCTYPE html>
<html lang="es-ES" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="th_templates/head :: head"></head>
<body>
  <header th:replace="th_templates/navbar :: navbar"></header>

  <main id="main-content" class="main-index">
    <div class="container text-center">
      <div class="row align-items-center">
        <div class="col left-col">
          <p class="subtitle">
            Hola <span th:text="${session.userSession.name}"></span>, bienvenido a
          </p>
          <h1 class="big-title">Home Repair</h1>

          <div sec:authorize="hasRole('ROLE_CUSTOMER')">
            <a class="btn btn-warning button btn-index-home"
               th:href="@{/search(profession='',st='')}">
              Buscar servicios
            </a>
          </div>

          <div sec:authorize="hasRole('ROLE_PROVIDER')">
            <a class="btn btn-warning button btn-index-home"
               th:href="@{/work/worksList}">
              Ver mis trabajos
            </a>
          </div>
        </div>

        <div class="col">
          <img class="image3" src="/img/repairHouse.svg" alt="">
        </div>
      </div>
    </div>

    <section id="services-cards" class="services-cards">
      <h2 class="title">Servicios</h2>
      <div th:replace="th_templates/cardServices :: cardServices"></div>
    </section>

    <section class="work-zone-section" aria-labelledby="work-zone-title">
      <p class="section-kicker">Cobertura</p>
      <h2 id="work-zone-title" class="title work-zone-title">Zona de trabajo</h2>
      <p class="work-zone-copy">Servicios disponibles en Barcelona y su área metropolitana.</p>
      <div th:replace="th_templates/map :: map"></div>
    </section>
  </main>

  <footer th:replace="th_templates/footer :: footer"></footer>
  <div th:replace="th_templates/bootstrap :: bootstrap"></div>
</body>
</html>
