<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="th_templates/head :: head"></head>
<body>
  <header th:replace="th_templates/navbar :: navbar"></header>

  <main class="main-index">
    <article class="card text-center big-card-profile" th:object="${user}">
      <div class="card-body">
        <img class="image-profile" th:src="@{'/image/DB/' + *{image}}" alt="Foto de perfil del profesional">
        <h1 class="title" th:text="*{name + ' ' + lastname}"></h1>

        <div class="profession-container">
          <h4 class="subtitle3">Profesión: <span th:text="*{profession}"></span></h4>
          <p>Descripción: <span th:text="*{description}"></span></p>
          <p>Email: <span th:text="*{email}"></span></p>
          <p>Teléfono: <span th:text="*{phone}"></span></p>
        </div>

        <div sec:authorize="hasRole('ROLE_CUSTOMER')">
          <a class="btn btn-warning button btn-form"
             th:href="@{/work/create(applicationType='work', idProvider=${user.id})}">
            🔨 Solicitar servicio
          </a>
        </div>

        <button th:if="${check != 'false'}"
                sec:authorize="hasAnyRole('ROLE_CUSTOMER','ROLE_ADMIN')"
                id="toggle-reviews"
                type="button"
                class="btn btn-warning button btn-form">
          Comentarios 📝
        </button>
      </div>
    </article>

    <section id="cards-review" hidden aria-label="Comentarios">
      <article class="card text-center large-card"
               th:each="review : ${listReviews}"
               th:if="${review.review != null}">
        <div class="card-body">
          <h3 class="card-title">
            <img th:src="@{'/image/DB/' + ${review.userCustomerId.image}}" alt="" class="imagen-customer">
            <span th:text="${review.userCustomerId.name + ' ' + review.userCustomerId.lastname}"></span>
          </h3>
          <p th:text="${review.review}"></p>
          <p aria-label="Puntuación">
            <span th:each="star : ${#numbers.sequence(1, review.ratingWork)}">⭐</span>
          </p>

          <form sec:authorize="hasRole('ROLE_ADMIN')" th:action="@{/work/deleteComment}" method="post">
            <input type="hidden" name="idWork" th:value="${review.id}">
            <button type="submit" class="btn btn-warning button btn-form">Eliminar comentario 🚫</button>
          </form>
        </div>
      </article>
    </section>
  </main>

  <footer th:replace="th_templates/footer :: footer"></footer>
  <div th:replace="th_templates/bootstrap :: bootstrap"></div>

  <script>
    const reviewButton = document.getElementById("toggle-reviews");
    const reviewSection = document.getElementById("cards-review");

    if (reviewButton && reviewSection) {
      reviewButton.addEventListener("click", () => {
        reviewSection.hidden = !reviewSection.hidden;
      });
    }
  </script>
</body>
</html>
