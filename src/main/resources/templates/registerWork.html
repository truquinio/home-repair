<!DOCTYPE html>
<html lang="es-ES" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="th_templates/head :: head"></head>
<body>
  <header th:replace="th_templates/navbar :: navbar"></header>

  <main id="main-content" class="main-index">
    <div class="container text-center">
      <img th:if="${#strings.equals(applicationType, 'work')}"
           class="image5"
           src="/img/providers.svg"
           alt="">
      <img th:if="${#strings.equals(applicationType, 'review')}"
           class="image3"
           src="/img/ranking.svg"
           alt="">

      <h1 th:if="${#strings.equals(applicationType, 'work')}" class="big-title">
        Solicitar un trabajo
      </h1>
      <h1 th:if="${#strings.equals(applicationType, 'review')}" class="big-title">
        Valorar el servicio
      </h1>
    </div>

    <div id="form-container" class="form-display">
      <form th:if="${#strings.equals(applicationType, 'work')}"
            id="work-form"
            method="post"
            th:action="@{/work/create(idProvider=${idProvider})}"
            th:object="${work}">
        <div class="field">
          <label class="label" for="workName">Título de la solicitud</label>
          <input type="text"
                 id="workName"
                 maxlength="100"
                 placeholder="Ej. Reparar pérdida de agua"
                 th:field="*{workName}"
                 required>
        </div>

        <div class="field">
          <label class="label" for="workDescription">Descripción</label>
          <textarea class="workDescription"
                    maxlength="700"
                    id="workDescription"
                    placeholder="Describí el problema y cualquier dato que pueda ayudar al profesional."
                    th:field="*{workDescription}"
                    required></textarea>
        </div>

        <button id="work-apply"
                class="btn btn-warning button btn-form"
                type="submit">
          Enviar solicitud
        </button>
      </form>

      <form th:if="${#strings.equals(applicationType, 'review')}"
            id="review-form"
            method="post"
            th:action="@{/work/create(idWork=${idWork})}"
            th:object="${workReview}">
        <div class="field">
          <label class="label" for="review">Cuenta cómo fue el servicio</label>
          <textarea id="review"
                    maxlength="500"
                    placeholder="Compartí una valoración útil para otros clientes."
                    th:field="*{review}"
                    required></textarea>
        </div>

        <div class="field">
          <label class="label" for="range-slider">Calificación</label>
          <input type="range"
                 id="range-slider"
                 min="1"
                 max="5"
                 value="5"
                 th:field="*{ratingWork}"
                 required>
          <p id="range-value" aria-live="polite"></p>
        </div>

        <button id="review-apply"
                type="submit"
                class="btn btn-warning button btn-form">
          Publicar valoración
        </button>
      </form>
    </div>
  </main>

  <footer th:replace="th_templates/footer :: footer"></footer>
  <div th:replace="th_templates/bootstrap :: bootstrap"></div>

  <script>
    const rangeSlider = document.getElementById("range-slider");
    const rangeValue = document.getElementById("range-value");

    if (rangeSlider && rangeValue) {
      const labels = {1: "Malo", 2: "Regular", 3: "Bueno", 4: "Muy bueno", 5: "Excelente"};

      const updateRatingLabel = () => {
        const value = Number(rangeSlider.value);
        rangeValue.textContent = labels[value] + " " + "★".repeat(value);
      };

      updateRatingLabel();
      rangeSlider.addEventListener("input", updateRatingLabel);
    }
  </script>
</body>
</html>
