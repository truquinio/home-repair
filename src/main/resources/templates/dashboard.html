<!DOCTYPE html>
<html lang="es-ES" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="th_templates/head :: head"></head>
<body>
  <header th:replace="th_templates/navbar :: navbar"></header>

  <main id="main-content" class="main-index">
    <div class="container text-center">
      <div class="row">
        <div class="col left-col">
          <h4 class="subtitle">Panel de gestión</h4>
          <h1 class="big-title">Administración</h1>
        </div>
        <div class="col">
          <img class="image2" src="/img/database.svg" alt="Ilustración de administración">
        </div>
      </div>
    </div>

    <form method="get" id="search-form" th:action="@{/admin/search}">
      <div class="row align-items-end g-3">
        <div class="col-md-8">
          <label for="search" class="label">Buscar usuario</label>
          <input type="search" name="search" id="search" th:value="${search}" placeholder="Nombre, apellido, email o profesión">
        </div>
        <div class="col-md-4 d-flex gap-2">
          <button type="submit" class="btn btn-warning button">🔎 Buscar</button>
          <a href="/admin/dashboard" class="btn btn-warning button">Limpiar</a>
        </div>
      </div>
    </form>

    <section th:if="${se != null}">
      <h2 class="title">Resultados de búsqueda</h2>
      <p th:if="${#lists.isEmpty(se)}" class="text-center">No se encontraron usuarios.</p>
      <div th:unless="${#lists.isEmpty(se)}" th:replace="~{dashboard :: userTable(users=${se}, tableTitle='Resultados')}"></div>
    </section>

    <section>
      <h2 class="title">Todos los usuarios</h2>
      <div th:replace="~{dashboard :: userTable(users=${users}, tableTitle='Usuarios')}"></div>
    </section>
  </main>

  <footer th:replace="th_templates/footer :: footer"></footer>
  <div th:replace="th_templates/bootstrap :: bootstrap"></div>

  <th:block th:fragment="userTable(users, tableTitle)">
    <div class="table-responsive">
      <table class="table table-dark table-striped align-middle">
        <caption class="visually-hidden" th:text="${tableTitle}"></caption>
        <thead>
          <tr>
            <th>Foto</th>
            <th>Estado</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Profesión</th>
            <th>Rol</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="u : ${users}">
            <td><img class="profilePic" th:src="@{'/image/DB/' + ${u.image}}" alt=""></td>
            <td th:text="${u.alta ? 'Activo' : 'Inactivo'}"></td>
            <td th:text="${u.name + ' ' + u.lastname}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.profession ?: '-'}"></td>
            <td th:text="${u.role}"></td>
            <td>
              <div class="d-flex flex-wrap gap-2">
                <form th:action="@{'/user/perfil/' + ${u.id} + '/role'}"
                      method="post"
                      th:if="${u.role.name() == 'PROVIDER'}">
                  <button class="btn btn-warning" type="submit">Pasar a cliente</button>
                </form>
                <form th:action="@{'/user/perfil/' + ${u.id} + '/alta'}"
                      method="post"
                      th:if="${u.role.name() != 'ADMIN'}">
                  <button class="btn btn-warning" type="submit" th:text="${u.alta ? 'Desactivar' : 'Activar'}"></button>
                </form>
                <a th:href="@{/user/perfil/{id}(id=${u.id})}" class="btn btn-warning">Modificar</a>
                <form th:action="@{'/user/perfil/' + ${u.id} + '/del'}" method="post" th:if="${u.role.name() != 'ADMIN'}">
                  <button class="btn btn-warning" type="submit">Eliminar</button>
                </form>
                <a th:href="@{'/user/perfil/' + ${u.id} + '/review'}" class="btn btn-warning" th:if="${u.role.name() == 'PROVIDER'}">Trabajos</a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </th:block>
</body>
</html>
