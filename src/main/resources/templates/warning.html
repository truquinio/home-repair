<!DOCTYPE html>
<html lang="es-ES" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="th_templates/head :: head"></head>
<body>
  <header th:replace="th_templates/navbar :: navbar"></header>

  <main id="main-content" class="main-index">
    <div class="container text-center">
      <div class="row align-items-center">
        <div class="col left-col">
          <h1 class="big-title" th:text="${'Error ' + codigo}">Error</h1>
          <p class="subtitle" th:text="${mensaje}">No pudimos completar la solicitud.</p>
          <a class="btn btn-warning button btn-back-home"
             th:href="@{/}">
            Volver al inicio
          </a>
        </div>

        <div class="col">
          <img class="image3" src="/img/error.svg" alt="">
        </div>
      </div>
    </div>
  </main>

  <footer th:replace="th_templates/footer :: footer"></footer>
  <div th:replace="th_templates/bootstrap :: bootstrap"></div>
</body>
</html>
