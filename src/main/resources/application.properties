spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/home_repair?allowPublicKeyRetrieval=true&useSSL=false&useTimezone=true&serverTimezone=GMT&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

# Maximum upload size for profile images.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
